name: Fix men custom option click
on:
  push:
    paths:
      - '.github/workflows/fix-men-custom-option-click.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/fix-men-custom-option-click.cjs
      - run: node --check _worker.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js .github
          git commit -m "Fix selectable custom options for men's sleeveless"
          git push
