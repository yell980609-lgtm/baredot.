name: Add first order coupon wallet
on:
  push:
    paths:
      - '.github/workflows/add-first-order-coupon-wallet.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/add-first-order-coupon-wallet.cjs
      - run: node --check _worker.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js .github
          git commit -m "Let members view and apply first order coupons"
          git push
