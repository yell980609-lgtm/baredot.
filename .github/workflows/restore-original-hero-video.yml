name: Restore original hero video
on:
  push:
    paths:
      - '.github/workflows/restore-original-hero-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/restore-original-hero-video.cjs
      - run: node --check _worker.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js .github
          git commit -m "Restore original women and men hero video"
          git push
