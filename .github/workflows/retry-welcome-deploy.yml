name: Retry welcome pack deployment

on:
  push:
    paths:
      - .github/retry-welcome-deploy.cjs
      - .github/workflows/retry-welcome-deploy.yml

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/retry-welcome-deploy.cjs
      - run: node --check _worker.js
      - run: |
          git config user.name "bare-dot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Retry welcome pack deployment"
          git push
